<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#d4b478"/></marker></defs><rect width="1200" height="660" rx="24" fill="#0e2035"/><text x="600" y="68" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="35" fill="#f4ead9">From sensing to decision</text><rect x="55" y="130" width="300" height="116" rx="18" fill="#19314c" stroke="#d4b478" stroke-width="2"/><text x="205" y="177" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="23" fill="#f4ead9">Sensor pulse</text><text x="205" y="214" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="18" fill="#b8c9dc">Explicit deadline</text><rect x="450" y="130" width="300" height="116" rx="18" fill="#19314c" stroke="#d4b478" stroke-width="2"/><text x="600" y="177" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="23" fill="#f4ead9">Validate the reading</text><text x="600" y="214" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="18" fill="#b8c9dc">Median and hysteresis</text><rect x="845" y="130" width="300" height="116" rx="18" fill="#19314c" stroke="#d4b478" stroke-width="2"/><text x="995" y="177" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="23" fill="#f4ead9">Current state</text><text x="995" y="214" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="18" fill="#b8c9dc">OLED, LEDs and buzzer</text><rect x="450" y="392" width="300" height="116" rx="18" fill="#19314c" stroke="#c79391" stroke-width="2"/><text x="600" y="439" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="23" fill="#f4ead9">Sensor failure</text><text x="600" y="476" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="18" fill="#b8c9dc">Fault, not empty or full</text><rect x="845" y="392" width="300" height="116" rx="18" fill="#19314c" stroke="#d4b478" stroke-width="2"/><text x="995" y="439" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="23" fill="#f4ead9">BLE connection</text><text x="995" y="476" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="18" fill="#b8c9dc">Consistent read and full event</text><g fill="none" stroke="#d4b478" stroke-width="3" marker-end="url(#arrow)"><path d="M355 188H438"/><path d="M750 188H833"/><path d="M995 246V380"/><path d="M600 246V380"/><path d="M750 450H833"/></g><text x="600" y="609" text-anchor="middle" direction="ltr" font-family="Times New Roman" font-size="19" fill="#acbfd4">Functional illustration — not wiring or device-operation evidence</text></svg>