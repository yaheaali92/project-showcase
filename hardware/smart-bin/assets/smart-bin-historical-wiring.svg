<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
 <title id="title">Historical smart-bin prototype wiring reconstructed from course sources</title>
 <desc id="desc">ESP32 uses GPIO5 trigger, GPIO18 echo directly from a 5-volt ultrasonic module, I2C GPIO21 and GPIO22, buzzer GPIO27, LEDs GPIO14, 32, 33, 26 and 25. Direct echo is an electrical risk, not a recommended connection.</desc>
 <rect width="1200" height="680" rx="32" fill="#10283b"/>
 <g fill="#163b4e" stroke="#b69a64" stroke-width="2"><rect x="435" y="155" width="330" height="390" rx="28"/><rect x="55" y="160" width="285" height="165" rx="20"/><rect x="55" y="390" width="285" height="160" rx="20"/><rect x="860" y="150" width="285" height="170" rx="20"/><rect x="860" y="390" width="285" height="160" rx="20"/></g>
 <g fill="#f3ead9" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="75" font-size="34">COURSE PROTOTYPE · HISTORICAL RECONSTRUCTION</text><text x="600" y="120" font-size="20" fill="#e5c77f">Documented pins, not a safe wiring instruction</text><text x="600" y="230" font-size="38">ESP32</text><text x="600" y="278" font-size="22">GPIO5 TRIG · GPIO18 ECHO</text><text x="600" y="318" font-size="22">GPIO21 SDA · GPIO22 SCL</text><text x="600" y="358" font-size="22">GPIO27 buzzer</text><text x="600" y="398" font-size="22">GPIO14 / 32 / 33 / 26 / 25 LEDs</text><text x="600" y="458" font-size="19">BLE → phone</text><text x="196" y="220" font-size="25">Ultrasonic module</text><text x="196" y="260" font-size="21">5 V · ECHO direct</text><text x="196" y="470" font-size="25">OLED display</text><text x="196" y="510" font-size="20">3.3 V · I²C</text><text x="1002" y="215" font-size="25">5 indicators</text><text x="1002" y="257" font-size="20">incl. GPIO14 power</text><text x="1002" y="465" font-size="25">Buzzer</text><text x="1002" y="505" font-size="20">GPIO27</text><text x="600" y="625" font-size="20" fill="#f3bfaf">5 V ECHO → GPIO18 is shown historically; protection was not documented.</text></g>
 <g stroke="#83c4bc" stroke-width="4" fill="none"><path d="M340 245h95M340 470h95M765 250h95M765 470h95"/></g>
</svg>
