<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
 <title id="title">Smart-bin reference wiring with input protection</title>
 <desc id="desc">ESP32 reference diagram preserves historical GPIO14 power indicator. Five LEDs have individual series resistors. A 5-volt ultrasonic module echo uses a 1-kiloohm high side and 2-kiloohm low side divider before GPIO18. Grounds are shared. Buzzer needs a transistor driver if current or type requires it. Verify exact modules before assembly.</desc>
 <rect width="1200" height="720" rx="32" fill="#10283b"/>
 <g fill="#f4ecdc" font-family="Arial,sans-serif"><text x="55" y="68" font-size="34">REFERENCE REBUILD · CONDITIONAL WIRING</text><text x="55" y="110" font-size="19" fill="#e5c77f">Verify board, breakout voltages and load current before construction</text></g>
 <g fill="#163b4e" stroke="#c7aa70" stroke-width="2"><rect x="450" y="180" width="300" height="395" rx="25"/><rect x="55" y="175" width="330" height="145" rx="18"/><rect x="55" y="360" width="330" height="170" rx="18"/><rect x="815" y="175" width="330" height="170" rx="18"/><rect x="815" y="385" width="330" height="150" rx="18"/></g>
 <g fill="#f4ecdc" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="245" font-size="38">ESP32 · 3.3 V GPIO</text><text x="600" y="302" font-size="21">GPIO5 → TRIG</text><text x="600" y="340" font-size="21">GPIO18 ← protected ECHO</text><text x="600" y="380" font-size="21">GPIO21 / 22 → SDA / SCL</text><text x="600" y="420" font-size="21">GPIO14 + 32/33/26/25 → LEDs</text><text x="600" y="460" font-size="21">GPIO27 → buzzer driver</text><text x="220" y="220" font-size="25">5 V ultrasonic module</text><text x="220" y="258" font-size="20">ECHO → 1 kΩ → GPIO18</text><text x="220" y="288" font-size="20">GPIO18 → 2 kΩ → GND</text><text x="220" y="415" font-size="25">3.3 V OLED module</text><text x="220" y="453" font-size="19">SDA 21 · SCL 22</text><text x="220" y="483" font-size="19">Check I²C pull-ups to 3.3 V</text><text x="980" y="220" font-size="25">Five LED branches</text><text x="980" y="260" font-size="20">each with 330 Ω series</text><text x="980" y="295" font-size="19">GPIO14 retained</text><text x="980" y="430" font-size="25">Buzzer on GPIO27</text><text x="980" y="470" font-size="19">driver if current demands</text><text x="980" y="500" font-size="19">flyback for inductive type</text></g>
 <g stroke="#88c9bd" stroke-width="4" fill="none"><path d="M385 252h65M385 440h65M750 260h65M750 450h65"/></g>
 <path d="M95 605h1010" stroke="#d8b973" stroke-width="4"/><g fill="#f4ecdc" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="640" font-size="23">COMMON GROUND · 5 V sensor rail separate from 3.3 V GPIO</text><text x="600" y="680" font-size="18">Reference only; no bench measurement or safety certification claimed</text></g>
</svg>
