<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
 <title id="title">Conditional baby-monitor reference wiring for a future rebuild</title>
 <desc id="desc">NodeMCU ESP8266 reference moves DHT11 from boot pin D3 to D6 GPIO12, and PIR from boot pin D4 to D7 GPIO13. MAX30102 remains on I2C D2 GPIO4 and D1 GPIO5 through a breakout whose regulation and level shifting must be documented. MAX9814 analog output must be conditioned for the measured A0 range of the exact board. Grounds and supply are common and verified. This is not the historical prototype wiring.</desc>
 <rect width="1200" height="760" rx="32" fill="#10283b"/>
 <g fill="#f4ecdc" font-family="Arial,sans-serif"><text x="55" y="67" font-size="32">FUTURE REBUILD · CONDITIONAL REFERENCE</text><text x="55" y="106" font-size="19" fill="#e5c77f">Not the course-prototype wiring; module and ADC limits must be verified</text></g>
 <g fill="#163b4e" stroke="#c7aa70" stroke-width="2"><rect x="440" y="200" width="320" height="380" rx="26"/><rect x="45" y="165" width="320" height="165" rx="18"/><rect x="45" y="390" width="320" height="175" rx="18"/><rect x="835" y="165" width="320" height="170" rx="18"/><rect x="835" y="390" width="320" height="175" rx="18"/></g>
 <g fill="#f4ecdc" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="255" font-size="34">NodeMCU ESP8266</text><text x="600" y="314" font-size="21">D6 / GPIO12 ← DHT11 DATA</text><text x="600" y="353" font-size="21">D7 / GPIO13 ← PIR OUT</text><text x="600" y="392" font-size="21">D2 / GPIO4 ← SDA</text><text x="600" y="431" font-size="21">D1 / GPIO5 → SCL</text><text x="600" y="470" font-size="21">A0 ← conditioned MICOUT</text><text x="205" y="216" font-size="27">DHT11</text><text x="205" y="258" font-size="20">3.3 V-compatible module</text><text x="205" y="294" font-size="18">bare sensor: data pull-up</text><text x="205" y="443" font-size="25">HC-SR501 PIR</text><text x="205" y="485" font-size="19">verify output ≤ 3.3 V</text><text x="995" y="215" font-size="25">MAX30102 breakout</text><text x="995" y="257" font-size="18">verify regulator + I²C levels</text><text x="995" y="290" font-size="18">bare chip is not 3.3 V logic</text><text x="995" y="443" font-size="26">MAX9814 module</text><text x="995" y="485" font-size="18">condition MICOUT for A0</text><text x="995" y="520" font-size="18">measure board A0 range</text></g>
 <g stroke="#88c9bd" stroke-width="4" fill="none"><path d="M365 250h75M365 475h75M760 250h75M760 475h75"/></g>
 <path d="M90 626h1020" stroke="#d8b973" stroke-width="4"/><g fill="#f4ecdc" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="660" font-size="21">COMMON GROUND · verify supply rails and breakout data sheets</text><text x="600" y="705" font-size="19">No clinical, electrical-safety or physical-build result is claimed</text></g>
</svg>
