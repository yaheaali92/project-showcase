<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NodeMCU / ESP8266 signal topology</title>
  <desc id="desc">DHT11 at D3, MAX30102 at SDA D2 and SCL D1, HC-SR501 at D4, and MAX9814 at A0. Signal assignment only; not a power or wiring diagram.</desc>
