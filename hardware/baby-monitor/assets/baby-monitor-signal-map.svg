    <rect x="850" y="105" width="295" height="140" rx="20" fill="#1d3a51" stroke="#5d8190" stroke-width="2"/>
    <circle cx="998" cy="139" r="13" fill="none" stroke="#d4b478" stroke-width="3"/>
    <circle cx="998" cy="139" r="5" fill="#d4b478"/>
    <text x="998" y="193" fill="#fff6e6" font-size="30" font-weight="700">MAX30102</text>

    <rect x="455" y="245" width="290" height="140" rx="22" fill="#d5b779" stroke="#f0d9a5" stroke-width="3"/>
