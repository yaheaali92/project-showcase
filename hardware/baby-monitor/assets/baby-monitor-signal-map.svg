  <circle cx="600" cy="315" r="158" fill="none" stroke="#42647b" stroke-width="2" stroke-dasharray="5 12"/>

  <g fill="none" stroke="#d4b478" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 175 H402 Q426 175 426 199 V286 H455"/>
    <path d="M850 175 H798 Q774 175 774 199 V286 H745"/>
